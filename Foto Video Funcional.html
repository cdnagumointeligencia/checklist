<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Teste Mídia → WhatsApp</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f0f0;color:#333;min-height:100vh;display:flex;flex-direction:column}
header{background:#25d366;color:#fff;padding:20px;text-align:center;font-size:20px;font-weight:700}
main{flex:1;padding:20px;max-width:500px;margin:0 auto;width:100%}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
h2{font-size:16px;margin-bottom:14px;color:#333}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;width:100%;transition:opacity .2s}
.btn:active{opacity:.8}
.btn-green{background:#25d366;color:#fff}
.btn-blue{background:#1a73e8;color:#fff}
.btn-gray{background:#e0e0e0;color:#333}
.btn-red{background:#ea4335;color:#fff}
input[type="file"]{display:none}
#photoPreview,#videoPreview{margin-top:14px;text-align:center;display:none}
#photoPreview img,#videoPreview video{max-width:100%;max-height:300px;border-radius:12px;border:3px solid #e0e0e0}
#status{margin-top:10px;font-size:14px;color:#666;text-align:center;min-height:20px}
#status.ok{color:#137333}
#status.err{color:#c5221f}
.tab-row{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;font-weight:600;text-align:center}
.tab.active{border-color:#25d366;background:#e6f4ea;color:#137333}
</style>
</head>
<body>
<header>📸 Teste Mídia → WhatsApp</header>
<main>
<div class="tab-row">
<button class="tab active" id="tabPhoto" onclick="switchTab('photo')">📷 Foto</button>
<button class="tab" id="tabVideo" onclick="switchTab('video')">🎥 Vídeo</button>
</div>

<div id="photoSection">
<div class="card">
<h2>1. Tire uma foto</h2>
<button class="btn btn-green" id="capturePhotoBtn">📷 Tirar Foto</button>
<input type="file" id="photoInput" accept="image/*" capture="environment">
</div>

<div class="card" id="photoPreview">
<h2>2. Preview</h2>
<img id="photoPreviewImg" src="" alt="Foto">
</div>
</div>

<div id="videoSection" style="display:none">
<div class="card">
<h2>1. Grave um vídeo</h2>
<button class="btn btn-green" id="captureVideoBtn">🎥 Gravar Vídeo</button>
<input type="file" id="videoInput" accept="video/*" capture="environment">
</div>

<div class="card" id="videoPreview">
<h2>2. Preview</h2>
<video id="videoPreviewEl" controls style="max-width:100%;max-height:300px;border-radius:12px;border:3px solid #e0e0e0"></video>
</div>
</div>

<div class="card">
<h2>3. Enviar para o WhatsApp</h2>
<button class="btn btn-blue" id="shareBtn" disabled>💬 Enviar via WhatsApp</button>
<div id="status"></div>
</div>

<div class="card">
<button class="btn btn-gray" id="resetBtn">🔄 Recomeçar</button>
</div>
</main>

<script>
let capturedFile=null
let currentTab='photo'

const capturePhotoBtn=document.getElementById('capturePhotoBtn')
const captureVideoBtn=document.getElementById('captureVideoBtn')
const photoInput=document.getElementById('photoInput')
const videoInput=document.getElementById('videoInput')
const photoPreview=document.getElementById('photoPreview')
const photoPreviewImg=document.getElementById('photoPreviewImg')
const videoPreview=document.getElementById('videoPreview')
const videoPreviewEl=document.getElementById('videoPreviewEl')
const shareBtn=document.getElementById('shareBtn')
const statusEl=document.getElementById('status')
const resetBtn=document.getElementById('resetBtn')
const tabPhoto=document.getElementById('tabPhoto')
const tabVideo=document.getElementById('tabVideo')
const photoSection=document.getElementById('photoSection')
const videoSection=document.getElementById('videoSection')

capturePhotoBtn.addEventListener('click',()=>photoInput.click())
captureVideoBtn.addEventListener('click',()=>videoInput.click())

photoInput.addEventListener('change',function(e){
const file=e.target.files[0]
if(!file)return
capturedFile=file
const reader=new FileReader()
reader.onload=function(ev){
photoPreviewImg.src=ev.target.result
photoPreview.style.display='block'
videoPreview.style.display='none'
shareBtn.disabled=false
capturePhotoBtn.textContent='📷 Trocar Foto'
statusEl.textContent='Foto: '+file.name+' ('+formatSize(file.size)+')'
statusEl.className='ok'
}
reader.readAsDataURL(file)
photoInput.value=''
})

videoInput.addEventListener('change',function(e){
const file=e.target.files[0]
if(!file)return
capturedFile=file
videoPreviewEl.src=URL.createObjectURL(file)
videoPreview.style.display='block'
photoPreview.style.display='none'
shareBtn.disabled=false
captureVideoBtn.textContent='🎥 Gravar Novo Vídeo'
statusEl.textContent='Vídeo: '+file.name+' ('+formatSize(file.size)+')'
statusEl.className='ok'
})

shareBtn.addEventListener('click',async()=>{
if(!capturedFile)return
shareBtn.disabled=true
statusEl.textContent='Enviando...'
statusEl.className=''

if(navigator.share){
try{
await navigator.share({
title:'Checklist Fácil',
text:currentTab==='photo'?'Foto do Checklist':'Vídeo do Checklist',
files:[capturedFile]
})
statusEl.textContent='✅ Enviado com sucesso!'
statusEl.className='ok'
return
}catch(err){
if(err.name==='AbortError'){
statusEl.textContent='Cancelado'
statusEl.className=''
return
}
statusEl.textContent='Erro: '+err.message
statusEl.className='err'
}
}

window.open('whatsapp://send?text='+encodeURIComponent(currentTab==='photo'?'Foto do Checklist':'Vídeo do Checklist'),'_blank')
statusEl.textContent='WhatsApp aberto. Anexe o arquivo manualmente.'
statusEl.className='err'
})

resetBtn.addEventListener('click',()=>{
capturedFile=null
photoPreview.style.display='none'
photoPreviewImg.src=''
videoPreview.style.display='none'
videoPreviewEl.src=''
shareBtn.disabled=true
capturePhotoBtn.textContent='📷 Tirar Foto'
captureVideoBtn.textContent='🎥 Gravar Vídeo'
statusEl.textContent=''
photoInput.value=''
videoInput.value=''
})

function switchTab(tab){
currentTab=tab
if(tab==='photo'){
tabPhoto.classList.add('active')
tabVideo.classList.remove('active')
photoSection.style.display=''
videoSection.style.display='none'
photoPreview.style.display='none'
videoPreview.style.display='none'
}else{
tabVideo.classList.add('active')
tabPhoto.classList.remove('active')
photoSection.style.display='none'
videoSection.style.display=''
photoPreview.style.display='none'
videoPreview.style.display='none'
}
capturedFile=null
shareBtn.disabled=true
statusEl.textContent=''
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B'
if(bytes<1048576)return(bytes/1024).toFixed(1)+' KB'
return(bytes/1048576).toFixed(1)+' MB'
}
</script>
</body>
</html>
